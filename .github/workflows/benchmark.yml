name: Benchmark

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  benchmark:
    name: Statistical overhead
    runs-on: ubuntu-latest
    permissions:
      contents: write # required by auto-push to the gh-pages branch below
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - name: Run benchmarks
        run: |
          uv run --frozen pytest benchmarks/test_stat_overhead.py \
            --benchmark-json=output.json \
            --benchmark-only \
            -v
      - run: git checkout -- uv.lock
      - uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba  # v1.22.1
        with:
          tool: pytest
          output-file-path: output.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          # test_mann_whitney_n50 alone has swung between ~1880 and ~2335
          # iter/sec across runs with no code change (shared-runner hardware
          # variance on a sub-millisecond micro-benchmark) -- a ratio of 1.24
          # is routine noise, not a regression. 120% + fail-on-alert has been
          # failing this workflow on unrelated commits for days. Widen the
          # threshold past the observed noise ceiling and keep alerting
          # (comment) without hard-failing CI on single-sample variance.
          alert-threshold: "160%"
          comment-on-alert: true
          fail-on-alert: false
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
